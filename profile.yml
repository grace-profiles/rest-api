description: Profile for REST API applications
features:
    defaults: 
        - async
        - cache
        - events
        - hibernate
        - rest
build:
    plugins:
        - war
        - org.graceframework.grace-web
    excludes:
        - org.graceframework.grace-core
dependencies:
    - scope: console
      coords: "org.graceframework:grace-console"
    - scope: compile
      coords: "org.graceframework:grace-boot-logging"
    - scope: compile
      coords: "org.graceframework:grace-boot-persistence"
    - scope: compile
      coords: "org.graceframework:grace-boot-plugin"
    - scope: compile
      coords: "org.graceframework:grace-boot-validation"
    - scope: compile
      coords: "org.graceframework:grace-boot-web"
    - scope: compile
      coords: "org.graceframework:grace-plugin-services"